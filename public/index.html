<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<title>The Parallel Universe Gazette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@500;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
<div id="ink-bar"></div>
<main id="portal">
  <div class="vortex"></div><div class="vortex v2"></div>
  <h1>Which universe shall we visit today?</h1>
  <form id="form">
    <input id="premise" placeholder="What if Bhopal became the capital of India?" autocomplete="off" enterkeyhint="go">
    <button>Enter Universe</button>
  </form>
  <div id="chips"></div>
  <div id="status" role="status"></div>
</main>
<div id="warp" hidden><div class="tunnel"></div><div id="warp-msg" role="status"></div></div>
<div id="stage" hidden><div id="gazette"></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
